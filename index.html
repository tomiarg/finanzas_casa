<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0D1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Casa">
  <link rel="manifest" href="/manifest.json">
  <title>Casa — Finanzas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0D1117;
      --surface: #161B22;
      --surface2: #1E2530;
      --border: #2A3441;
      --text: #E6EDF3;
      --muted: #7D8590;
      --accent: #F0B429;
      --success: #3FB950;
      --danger: #FF6B6B;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      overflow-x: hidden;
    }

    .header { padding: 52px 24px 20px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; color: var(--accent); }
    .month-badge {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 14px; font-size: 13px;
      color: var(--muted); font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }

    .balance-card {
      margin: 0 16px 20px;
      background: linear-gradient(135deg, #1a2332 0%, #0f1923 100%);
      border: 1px solid var(--border); border-radius: 24px; padding: 24px;
      position: relative; overflow: hidden;
    }
    .balance-card::before {
      content: ''; position: absolute; top: -40px; right: -40px;
      width: 140px; height: 140px;
      background: radial-gradient(circle, rgba(240,180,41,0.12) 0%, transparent 70%);
      border-radius: 50%;
    }
    .balance-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 8px; }
    .balance-amount {
      font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 800;
      letter-spacing: -1px; line-height: 1; margin-bottom: 20px;
    }
    .balance-amount.negative { color: var(--danger); }
    .balance-amount.low { color: var(--accent); }
    .balance-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .balance-item { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 12px; }
    .balance-item-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.8px; }
    .balance-item-value { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; }
    .balance-item-value.income { color: var(--success); }
    .balance-item-value.expense { color: var(--danger); }

    .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .progress-bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--success), var(--accent)); transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1); }
    .progress-fill.warning { background: linear-gradient(90deg, var(--accent), #FF8C00); }
    .progress-fill.danger { background: linear-gradient(90deg, var(--accent), var(--danger)); }

    .section-title {
      font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted);
      padding: 0 24px; margin-bottom: 12px;
    }

    .quick-add {
      margin: 0 16px 24px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 14px; text-align: center; font-size: 14px; font-weight: 500;
      cursor: pointer; color: var(--muted); transition: all 0.2s;
      border: none; background: none; font-family: 'DM Sans', sans-serif;
    }
    .tab.active { color: var(--text); background: var(--surface2); }
    .tab.active.income-tab { color: var(--success); }
    .tab.active.expense-tab { color: var(--danger); }

    .form-body { padding: 16px; }
    .amount-input-wrap { position: relative; margin-bottom: 12px; }
    .currency-prefix {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700;
      color: var(--muted); pointer-events: none;
    }
    .amount-input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 16px 16px 36px;
      font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800;
      color: var(--text); letter-spacing: -0.5px; outline: none; transition: border-color 0.2s;
    }
    .amount-input:focus { border-color: var(--accent); }
    .amount-input::placeholder { color: var(--border); }

    .categories { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .cat-btn {
      background: var(--surface2); border: 1.5px solid var(--border); border-radius: 12px;
      padding: 10px 4px; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; gap: 4px; transition: all 0.15s; font-family: 'DM Sans', sans-serif;
    }
    .cat-btn:active { transform: scale(0.95); }
    .cat-btn.selected { border-color: var(--accent); background: rgba(240,180,41,0.1); }
    .cat-btn.selected.income-cat { border-color: var(--success); background: rgba(63,185,80,0.1); }
    .cat-icon { font-size: 20px; }
    .cat-label { font-size: 10px; color: var(--muted); font-weight: 500; }

    .submit-btn {
      width: 100%; padding: 16px; border: none; border-radius: 12px;
      font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
      letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s;
      background: var(--accent); color: #0D1117;
    }
    .submit-btn:active { transform: scale(0.98); opacity: 0.9; }
    .submit-btn.income-btn { background: var(--success); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .transactions { padding: 0 16px 100px; }
    .tx-list { display: flex; flex-direction: column; gap: 8px; }
    .tx-item {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; display: flex; align-items: center; gap: 14px;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    .tx-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; background: var(--surface2); }
    .tx-info { flex: 1; min-width: 0; }
    .tx-cat { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
    .tx-meta { font-size: 12px; color: var(--muted); }
    .tx-amount { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; flex-shrink: 0; }
    .tx-amount.income { color: var(--success); }
    .tx-amount.expense { color: var(--danger); }
    .tx-delete { background: none; border: none; color: var(--border); cursor: pointer; padding: 4px; border-radius: 8px; font-size: 16px; transition: color 0.2s; }
    .tx-delete:active { color: var(--danger); }

    .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-text { font-size: 14px; line-height: 1.6; }

    .loading-state { text-align: center; padding: 32px; color: var(--muted); font-size: 14px; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100;
      display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 24px 24px 0 0; padding: 24px; width: 100%;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .month-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .month-opt {
      padding: 12px; background: var(--surface2); border: 1.5px solid var(--border);
      border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 500;
      text-align: center; transition: all 0.15s; color: var(--text);
    }
    .month-opt.active { border-color: var(--accent); color: var(--accent); background: rgba(240,180,41,0.08); }

    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 99px; padding: 12px 20px; font-size: 13px; font-weight: 500;
      z-index: 200; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Sync indicator */
    .sync-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); display: inline-block;
      margin-left: 6px; vertical-align: middle;
    }
    .sync-dot.syncing { background: var(--accent); animation: pulse 1s infinite; }
    .sync-dot.error { background: var(--danger); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">Casa 🏠 <span class="sync-dot" id="sync-dot" title="Sincronizado"></span></div>
    <div class="month-badge" onclick="openMonthModal()">
      <span id="month-display">—</span> <span>▾</span>
    </div>
  </div>
</div>

<div class="balance-card">
  <div class="balance-label">Disponible este mes</div>
  <div class="balance-amount" id="balance-display">$0</div>
  <div class="balance-row">
    <div class="balance-item">
      <div class="balance-item-label">Entró</div>
      <div class="balance-item-value income" id="income-display">$0</div>
    </div>
    <div class="balance-item">
      <div class="balance-item-label">Salió</div>
      <div class="balance-item-value expense" id="expense-display">$0</div>
    </div>
  </div>
  <div class="progress-label">
    <span>Uso del mes</span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>
</div>

<div class="section-title">Registrar</div>
<div class="quick-add">
  <div class="tabs">
    <button class="tab expense-tab active" onclick="setMode('expense')">— Gasto</button>
    <button class="tab income-tab" onclick="setMode('income')">+ Ingreso</button>
  </div>
  <div class="form-body">
    <div class="amount-input-wrap">
      <span class="currency-prefix">$</span>
      <input class="amount-input" type="number" inputmode="numeric" id="amount-input" placeholder="0" />
    </div>
    <div class="categories" id="categories-container"></div>
    <button class="submit-btn" id="submit-btn" onclick="addTransaction()">Registrar gasto</button>
  </div>
</div>

<div class="section-title">Movimientos</div>
<div class="transactions">
  <div class="tx-list" id="tx-list"><div class="loading-state">Cargando...</div></div>
</div>

<div class="modal-overlay" id="month-modal" onclick="closeMonthModal(event)">
  <div class="modal">
    <div class="modal-title">Seleccionar mes</div>
    <div class="month-list" id="month-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const EXPENSE_CATS = [
  { id: 'colegio',  icon: '🎓', label: 'Colegio' },
  { id: 'salud',    icon: '🏥', label: 'Salud' },
  { id: 'auto',     icon: '🚗', label: 'Autos/Moto' },
  { id: 'comida',   icon: '🛒', label: 'Mercado' },
  { id: 'delivery', icon: '🍕', label: 'Delivery' },
  { id: 'ropa',     icon: '👕', label: 'Ropa' },
  { id: 'tarjeta',  icon: '💳', label: 'Tarjeta' },
  { id: 'otros',    icon: '📦', label: 'Otros' },
];
const INCOME_CATS = [
  { id: 'agencia',  icon: '💼', label: 'Agencia' },
  { id: 'extra',    icon: '⚡', label: 'Extra' },
  { id: 'cuota',    icon: '💰', label: 'Cuota' },
  { id: 'otros_i',  icon: '📥', label: 'Otros' },
];
const ALL_CATS = [...EXPENSE_CATS, ...INCOME_CATS];

let currentMode = 'expense';
let selectedCat = EXPENSE_CATS[0].id;
let currentMonth = getCurrentMonthKey();
let transactions = [];
let pollInterval = null;

function getCurrentMonthKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function monthKeyToLabel(key) {
  const [y, m] = key.split('-');
  const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${months[parseInt(m)-1]} ${y}`;
}
function fmt(n) {
  return '$' + Math.abs(n).toLocaleString('es-AR', { maximumFractionDigits: 0 });
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function setSyncState(state) {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot' + (state === 'syncing' ? ' syncing' : state === 'error' ? ' error' : '');
}

// ── API ───────────────────────────────────────────────────────────────────
async function fetchTransactions() {
  setSyncState('syncing');
  try {
    const res = await fetch(`/api/transactions?month=${currentMonth}`);
    transactions = await res.json();
    setSyncState('ok');
    renderAll();
  } catch(e) {
    setSyncState('error');
  }
}

async function addTransaction() {
  const raw = document.getElementById('amount-input').value;
  const amount = parseFloat(raw);
  if (!amount || amount <= 0) { showToast('⚠️ Ingresá un monto válido'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;

  const tx = {
    id: Date.now().toString(),
    type: currentMode,
    cat: selectedCat,
    amount,
    month: currentMonth,
    date: new Date().toISOString()
  };

  setSyncState('syncing');
  try {
    await fetch('/api/transactions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(tx)
    });
    document.getElementById('amount-input').value = '';
    showToast(currentMode === 'expense' ? '✓ Gasto registrado' : '✓ Ingreso registrado');
    await fetchTransactions();
  } catch(e) {
    setSyncState('error');
    showToast('❌ Error al guardar');
  } finally {
    btn.disabled = false;
  }
}

async function deleteTransaction(id) {
  setSyncState('syncing');
  try {
    await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
    showToast('Eliminado');
    await fetchTransactions();
  } catch(e) {
    setSyncState('error');
    showToast('❌ Error al eliminar');
  }
}

// ── Render ────────────────────────────────────────────────────────────────
function renderBalance() {
  const income  = transactions.filter(t => t.type === 'income').reduce((s,t) => s + parseFloat(t.amount), 0);
  const expense = transactions.filter(t => t.type === 'expense').reduce((s,t) => s + parseFloat(t.amount), 0);
  const balance = income - expense;
  const pct = income > 0 ? Math.min(100, Math.round((expense / income) * 100)) : 0;

  const balEl = document.getElementById('balance-display');
  balEl.textContent = fmt(balance);
  balEl.className = 'balance-amount' + (balance < 0 ? ' negative' : (pct > 80 ? ' low' : ''));

  document.getElementById('income-display').textContent = fmt(income);
  document.getElementById('expense-display').textContent = fmt(expense);
  document.getElementById('progress-pct').textContent = pct + '%';

  const fill = document.getElementById('progress-fill');
  fill.style.width = pct + '%';
  fill.className = 'progress-fill' + (pct >= 90 ? ' danger' : pct >= 70 ? ' warning' : '');
}

function renderTransactions() {
  const list = document.getElementById('tx-list');
  if (!transactions.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">Sin movimientos este mes.<br>Empezá registrando el primer ingreso.</div></div>`;
    return;
  }
  list.innerHTML = transactions.map(tx => {
    const cat = ALL_CATS.find(c => c.id === tx.cat) || { icon: '📦', label: tx.cat };
    const sign = tx.type === 'income' ? '+' : '-';
    const cls  = tx.type === 'income' ? 'income' : 'expense';
    const d = new Date(tx.date);
    const dateStr = d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    return `<div class="tx-item">
      <div class="tx-icon">${cat.icon}</div>
      <div class="tx-info">
        <div class="tx-cat">${cat.label}</div>
        <div class="tx-meta">${dateStr}</div>
      </div>
      <div class="tx-amount ${cls}">${sign}${fmt(tx.amount)}</div>
      <button class="tx-delete" onclick="deleteTransaction('${tx.id}')">✕</button>
    </div>`;
  }).join('');
}

function renderCategories() {
  const cats = currentMode === 'expense' ? EXPENSE_CATS : INCOME_CATS;
  document.getElementById('categories-container').innerHTML = cats.map(c => `
    <button class="cat-btn ${selectedCat === c.id ? 'selected' + (currentMode === 'income' ? ' income-cat' : '') : ''}"
            onclick="selectCat('${c.id}')">
      <span class="cat-icon">${c.icon}</span>
      <span class="cat-label">${c.label}</span>
    </button>`).join('');
}

function renderMonthDisplay() {
  document.getElementById('month-display').textContent = monthKeyToLabel(currentMonth);
}

function renderAll() {
  renderBalance();
  renderTransactions();
  renderMonthDisplay();
}

// ── Controls ──────────────────────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode;
  const cats = mode === 'expense' ? EXPENSE_CATS : INCOME_CATS;
  selectedCat = cats[0].id;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.${mode}-tab`).classList.add('active');
  const btn = document.getElementById('submit-btn');
  btn.textContent = mode === 'expense' ? 'Registrar gasto' : 'Registrar ingreso';
  btn.className = 'submit-btn' + (mode === 'income' ? ' income-btn' : '');
  renderCategories();
}

function selectCat(id) { selectedCat = id; renderCategories(); }

function openMonthModal() {
  const list = document.getElementById('month-list');
  const now = new Date();
  const months = [];
  for (let i = 0; i < 6; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    months.push(key);
  }
  list.innerHTML = months.map(k => `
    <div class="month-opt ${k === currentMonth ? 'active' : ''}" onclick="selectMonth('${k}')">
      ${monthKeyToLabel(k)}
    </div>`).join('');
  document.getElementById('month-modal').classList.add('open');
}

function closeMonthModal(e) {
  if (e.target === e.currentTarget) document.getElementById('month-modal').classList.remove('open');
}

async function selectMonth(key) {
  currentMonth = key;
  document.getElementById('month-modal').classList.remove('open');
  document.getElementById('tx-list').innerHTML = '<div class="loading-state">Cargando...</div>';
  await fetchTransactions();
}

// ── Polling — sincronización en tiempo real cada 10s ─────────────────────
function startPolling() {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(fetchTransactions, 10000);
}

// ── Init ──────────────────────────────────────────────────────────────────
setMode('expense');
fetchTransactions();
startPolling();
</script>
</body>
</html>
